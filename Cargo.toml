[package]
name = "spice-framework"
version = "0.2.0"
edition = "2021"
description = "A Rust test framework for nondeterministic LLM agents"
license = "MIT"
homepage = "https://github.com/ethereumdegen/spice"
repository = "https://github.com/ethereumdegen/spice"
keywords = ["testing", "llm", "agents", "ai", "framework"]
categories = ["development-tools::testing"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dotenvy = "0.15.7"
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = []
# Enables `judge::OpenAiJudge`, a ready-made LLM-as-judge backed by the OpenAI
# chat-completions API.
openai = ["dep:reqwest"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[[example]]
name = "mock_harness"
path = "examples/mock_harness.rs"

[[example]]
name = "weather_agent"
path = "examples/weather_agent/main.rs"

[[example]]
name = "recipe_agent"
path = "examples/recipe_agent/main.rs"

[[example]]
name = "eval_dataset"
path = "examples/eval_dataset.rs"
